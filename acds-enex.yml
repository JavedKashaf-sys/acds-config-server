server:
  port: 9091

spring:
  application:
    name: acds-enex

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/acdsenexsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        envers:
          audit_table_suffix: "_AUD"
          revision_field_name: "REV"
          revision_type_field_name: "REVTYPE"
          store_data_at_delete: true
          global_with_modified_flag: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 5s
      timeout: 3s

  cache:
    type: redis
    redis:
      time-to-live: 86400000
      cache-null-values: false

eureka:
  instance:
    preferIpAddress: true

  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always  
  info:
    env:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}     


logging:
  file:
    name: ${ACDS_LOG_PATH:${user.dir}/acds-logs}/${spring.application.name}/${spring.application.name}.log

  level:
    root: INFO
    com.acds.enex: INFO
    com.acds.commons: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

  logback:
    rollingpolicy:
      file-name-pattern: ${ACDS_LOG_PATH:${user.dir}/acds-logs}/${spring.application.name}/archive/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: false

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{trace_id:-}] [spanId=%X{span_id:-}] [traceFlags=%X{trace_flags:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{trace_id:-}] [spanId=%X{span_id:-}] [traceFlags=%X{trace_flags:-}] %logger{36} - %msg%n"
