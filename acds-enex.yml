server:
  port: 9091

logging:
  file:
    name: ${ACDS_LOG_PATH:C:/Users/MOF/Documents/ACDS/logs}/${spring.application.name}.log

  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

  logback:
    rollingpolicy:
      file-name-pattern: ${ACDS_LOG_PATH:C:/Users/MOF/Documents/ACDS/logs}/archive/${spring.application.name}-%d{yyyy-MM-dd}.log
      max-history: 30
      total-size-cap: 2GB

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
  
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/acdsenexsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        envers:
          audit_table_suffix: "_AUD"
          revision_field_name: "REV"
          revision_type_field_name: "REVTYPE"
          store_data_at_delete: true
          global_with_modified_flag: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 5s
      timeout: 3s

  cache:
    type: redis
    redis:
      time-to-live: 86400000
      cache-null-values: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

eureka:
  instance:
    preferIpAddress: true

  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}
