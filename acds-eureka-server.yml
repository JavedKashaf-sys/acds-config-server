spring:
  application:
    name: acds-eureka-server

server:
  port: 8070

eureka:
  instance:
    hostname: acds-eureka-server
    prefer-ip-address: true

  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8070/eureka/

logging:
  file:
    name: ${user.dir}/acds-logs/${spring.application.name}/${spring.application.name}.log

  level:
    root: INFO
    com.acds.enex: INFO
    com.acds.commons: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

  logback:
    rollingpolicy:
      file-name-pattern: ${user.dir}/acds-logs/${spring.application.name}/archive/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 2GB

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
