spring:
  application:
    name: acds-gateway-server

server:
  port: 8072

eureka:
  instance:
    preferIpAddress: true

  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "http://localhost:8070/eureka/"

logging:
  file:
    name: ${user.dir}/acds-logs/${spring.application.name}/${spring.application.name}.log

  level:
    root: INFO
    com.acds: DEBUG
    com.acds.commons: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

  logback:
    rollingpolicy:
      file-name-pattern: ${user.dir}/acds-logs/${spring.application.name}/archive/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: false

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %logger{36} - %msg%n"
