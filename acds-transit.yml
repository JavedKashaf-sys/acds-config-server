spring:
  application:
    name: acds-transit

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/acdstransitsdb}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 9092

eureka:
  instance:
    preferIpAddress: true

  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8070/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces     

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:
  file:
    name: ${ACDS_LOG_PATH:${user.dir}/acds-logs}/${spring.application.name}/${spring.application.name}.log

  level:
    root: INFO
    com.acds.enex: INFO
    com.acds.commons: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

  logback:
    rollingpolicy:
      file-name-pattern: ${ACDS_LOG_PATH:${user.dir}/acds-logs}/${spring.application.name}/archive/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: false

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{trace_id:-}] [spanId=%X{span_id:-}] [traceFlags=%X{trace_flags:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-}] [traceId=%X{trace_id:-}] [spanId=%X{span_id:-}] [traceFlags=%X{trace_flags:-}] %logger{36} - %msg%n"
